slam_toolbox:
  ros__parameters:
    qos_overrides:
      /scan:
        reliability: best_effort
        durability: volatile
        history: keep_last
        depth: 10
    
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss  # Smoothing
    
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    odom_topic: /ekf_odom
    use_map_saver: true
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0  # ✅ Faster updates (was 10.0)
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.0
    max_laser_range: 20.0
    minimum_time_interval: 0.3  # ✅ Faster processing (was 0.5)
    transform_timeout: 0.2
    tf_buffer_duration: 14400.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    
    # BALANCED KEYFRAMING (not too sparse!)
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3  # ✅ LOWER! (was 1.0 - too high!)
    minimum_travel_heading: 0.2   # ✅ ~11° (was 0.3)
    check_min_dist_and_heading_precisely: false  # ✅ OR logic for initial keyframe
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.15  # ✅ Moderate
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    
    # SMOOTH OPTIMIZATION
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.8
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.95
    minimum_distance_penalty: 0.6
    use_response_expansion: false  # No oscillation
    min_pass_through: 5  # ✅ Moderate smoothing
    occupancy_threshold: 0.1